### audiobookshelf (with Discovery) — deploy on the target Docker host ###
#
# 1. Load the image on this host first (one of):
#      docker load < abs-discovery.tar.gz        # if you copied the tarball over
#      docker pull <registry>/<user>/audiobookshelf-discovery:latest   # if you pushed to a registry
#      docker build -t audiobookshelf-discovery:latest .               # if you build on this host
#
# 2. Adjust the volume paths on the left of each ':' to match this host, then:
#      docker compose -f docker-compose.discovery.yml up -d
#
# 3. Browse to http://<this-host>:13378  (served at the root path)
#
services:
  audiobookshelf:
    image: audiobookshelf-discovery:latest
    container_name: audiobookshelf
    ports:
      # host:container — change only the host (left) port if 13378 is taken
      - 13378:80
    volumes:
      # --- Library media (add/rename as many as you want) ---
      - ./audiobooks:/audiobooks
      - ./ebooks:/ebooks
      # --- ABS data ---
      - ./metadata:/metadata
      - ./config:/config
      # --- Discovery imports ---
      # Mount qBittorrent's COMPLETED-downloads directory here so ABS can import finished
      # torrents. Then in Settings -> Discovery set "Download Path" to /downloads.
      # The path on the left must be qBittorrent's real completed-downloads dir on this host.
      - /path/to/qbittorrent/downloads:/downloads
    environment:
      - TZ=Etc/UTC
    restart: unless-stopped
    # Run as a specific user if needed (match your media file ownership):
    # user: "1000:1000"
